# Тестовый стенд: Postgres + API + Flutter web + Caddy (HTTPS).
# Запуск: cp deploy/.env.example .env && (заполнить) && docker compose -f docker-compose.deploy.yml up -d --build
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD}
      POSTGRES_DB: fitness_yoda
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fitness_yoda"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Хранилище картинок (S3-совместимое, MinIO AIStor Free). Наружу не открыто: читают через Caddy (https://API_HOST/files/...).
  # Нужен файл лицензии (бесплатный ключ: https://www.min.io/download), путь задаёт MINIO_LICENSE_FILE.
  # Бакет и анонимное чтение создаёт сам API при старте, отдельный mc-контейнер не нужен.
  minio:
    image: ${MINIO_IMAGE:-quay.io/minio/aistor/minio:RELEASE.2026-09-19T17-05-25Z}
    restart: unless-stopped
    command: server /data --license /minio.license
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?задайте S3_SECRET_KEY}
    volumes:
      - miniodata:/data
      - ${MINIO_LICENSE_FILE:?задайте MINIO_LICENSE_FILE (путь к minio.license)}:/minio.license:ro

  api:
    build:
      context: .
      dockerfile: deploy/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/fitness_yoda
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?задайте JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?задайте JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-30}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      RUN_SEED: ${RUN_SEED:-true}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-media}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minio}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?задайте S3_SECRET_KEY}
      # Ссылка/QR приглашения: https://APP_HOST/i/<token> (см. docs/deploy-test-stand.md).
      INVITE_HTTPS_BASE: ${INVITE_HTTPS_BASE:-https://${APP_HOST:?задайте APP_HOST}}
      S3_PUBLIC_URL: https://${API_HOST:?задайте API_HOST}/files/${S3_BUCKET:-media}

  web:
    build:
      context: .
      dockerfile: deploy/web/Dockerfile
      args:
        API_BASE_URL: https://${API_HOST:?задайте API_HOST}
    restart: unless-stopped
    depends_on:
      - api
      - minio
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_HOST: ${APP_HOST:?задайте APP_HOST}
      API_HOST: ${API_HOST}
    volumes:
      - caddy_data:/data

volumes:
  pgdata:
  miniodata:
  caddy_data:
