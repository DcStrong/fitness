# Тестовый стенд: Postgres + API + Flutter web + Caddy (HTTPS).
# Запуск: cp deploy/.env.example .env && (заполнить) && docker compose -f docker-compose.deploy.yml up -d --build
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD}
      POSTGRES_DB: fitness_yoda
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fitness_yoda"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Хранилище картинок (S3-совместимое). Наружу не открыто: читают через Caddy (https://API_HOST/files/...).
  minio:
    image: ${MINIO_IMAGE:-quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z}
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?задайте S3_SECRET_KEY}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Создаёт бакет и включает анонимное скачивание объектов (запись — только по ключам).
  minio-init:
    image: ${MINIO_MC_IMAGE:-quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z}
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/${S3_BUCKET:-media};
      mc anonymous set download local/${S3_BUCKET:-media};
      "
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?задайте S3_SECRET_KEY}

  api:
    build:
      context: .
      dockerfile: deploy/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/fitness_yoda
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?задайте JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?задайте JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-30}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      RUN_SEED: ${RUN_SEED:-true}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-media}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minio}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?задайте S3_SECRET_KEY}
      # Ссылка/QR приглашения: https://APP_HOST/i/<token> (см. docs/deploy-test-stand.md).
      INVITE_HTTPS_BASE: ${INVITE_HTTPS_BASE:-https://${APP_HOST:?задайте APP_HOST}}
      S3_PUBLIC_URL: https://${API_HOST:?задайте API_HOST}/files/${S3_BUCKET:-media}

  web:
    build:
      context: .
      dockerfile: deploy/web/Dockerfile
      args:
        API_BASE_URL: https://${API_HOST:?задайте API_HOST}
    restart: unless-stopped
    depends_on:
      - api
      - minio
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_HOST: ${APP_HOST:?задайте APP_HOST}
      API_HOST: ${API_HOST}
    volumes:
      - caddy_data:/data

volumes:
  pgdata:
  miniodata:
  caddy_data:
