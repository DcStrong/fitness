services:
  postgres:
    image: postgres:16-alpine
    container_name: fitness_yoda_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: fitness_yoda
    volumes:
      - fitness_yoda_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fitness_yoda"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fitness_yoda_pgdata:
