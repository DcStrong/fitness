services:
  postgres:
    image: postgres:16-alpine
    container_name: fitness_yoda_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: fitness_yoda
    volumes:
      - fitness_yoda_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fitness_yoda"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-совместимое хранилище для картинок (аватары, портфолио), MinIO AIStor Free. Консоль: http://localhost:9001
  # Нужен файл лицензии (бесплатный ключ: https://www.min.io/download), по умолчанию ./minio.license (в git не попадает).
  # Бакет и анонимное чтение создаёт сам API при старте.
  minio:
    image: ${MINIO_IMAGE:-quay.io/minio/aistor/minio:RELEASE.2026-09-19T17-05-25Z}
    container_name: fitness_yoda_minio
    restart: unless-stopped
    command: server /data --license /minio.license --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - fitness_yoda_minio:/data
      - ${MINIO_LICENSE_FILE:-./minio.license}:/minio.license:ro

volumes:
  fitness_yoda_pgdata:
  fitness_yoda_minio:
